<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperAgent · 智能体</title>
<style>
  :root{
    --bg:#0a0e1a; --side:#0f1526; --card:#151d33; --card2:#1a2340; --border:#263154;
    --text:#e9eef8; --muted:#8b98b8; --accent:#5b6cff; --accent2:#9b5cff; --teal:#14b8a6;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;height:100vh;display:flex;overflow:hidden}
  button{font-family:inherit}
  /* 左栏：技能 */
  .left{width:230px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border)}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:18px}
  .brand h1{font-size:15px;font-weight:700}.brand .sub{font-size:11px;color:var(--muted)}
  .sk-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  .sk-head span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
  .sk-head button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px}
  .skills{flex:1;overflow-y:auto;padding:4px 10px 16px}
  .skill{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:.15s;margin-bottom:2px}
  .skill:hover{background:rgba(91,108,255,.08)}
  .skill.on{background:rgba(91,108,255,.14)}
  .skill .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--card2);flex-shrink:0}
  .skill .t{font-size:13px}.skill .d{font-size:10px;color:var(--muted);line-height:1.3}
  .skill .sw{margin-left:auto;width:30px;height:18px;border-radius:10px;background:var(--border);position:relative;flex-shrink:0}
  .skill .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#889;transition:.2s}
  .skill.on .sw{background:var(--accent)}.skill.on .sw::after{left:15px;background:#fff}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--err);display:inline-block;margin-right:6px}
  .dot.ok{background:var(--ok)}
  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--side)}
  .top .stat{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .key{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:8px;width:200px;font-family:monospace;font-size:12px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:8px 15px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn.ok{background:var(--ok)}.btn.err{background:var(--err)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{padding:5px 10px;font-size:12px}
  /* 聊天 */
  .chat{flex:1;overflow-y:auto;padding:24px 26px;display:flex;flex-direction:column;gap:16px}
  .msg{display:flex;gap:11px;max-width:78%}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex-shrink:0}
  .msg.ai .av{background:linear-gradient(135deg,var(--teal),var(--accent))}
  .msg.me .av{background:var(--card2);border:1px solid var(--border)}
  .bub{padding:12px 15px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .msg.ai .bub{background:var(--card);border:1px solid var(--border);border-top-left-radius:4px}
  .msg.me .bub{background:linear-gradient(135deg,var(--accent),var(--accent2));border-top-right-radius:4px}
  .canvas{margin-top:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .grid .cell{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--card2)}
  .grid img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
  .grid .pick{position:absolute;bottom:6px;left:6px;right:6px}
  .grid .picked{border:2px solid var(--ok)}
  video{max-width:100%;border-radius:12px;border:1px solid var(--border);background:#000}
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:rgba(91,108,255,.16);color:#a5b4fc;margin:2px}
  /* 输入区 */
  .input{display:flex;gap:10px;align-items:flex-end;padding:14px 20px;border-top:1px solid var(--border);background:var(--side)}
  .input textarea{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;font-size:14px;resize:none;min-height:46px;max-height:160px;font-family:inherit}
  .input textarea:focus{outline:none;border-color:var(--accent)}
  .tools{display:flex;gap:6px;padding:0 20px 10px;flex-wrap:wrap}
  .tool{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:6px 11px;border-radius:18px;cursor:pointer;transition:.15s}
  .tool:hover{color:var(--text);border-color:var(--accent)}
  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;width:400px;max-width:92vw}
  .modal h3{font-size:15px;margin-bottom:14px}
  .modal input,.modal textarea{width:100%;background:#0d1428;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:10px;font-family:inherit}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes rot{to{transform:rotate(360deg)}}
  .empty{color:var(--muted);text-align:center;margin-top:40px;font-size:14px}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1px solid var(--border);padding:12px 18px;border-radius:11px;font-size:13px;opacity:0;transition:.3s;z-index:60}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="left">
  <div class="brand"><div class="logo">🤖</div><div><h1>SuperAgent</h1><div class="sub">智能体控制台</div></div></div>
  <div class="sk-head"><span>技能</span><button onclick="openAddSkill()">＋ 添加</button></div>
  <div class="skills" id="skillList"></div>
</div>

<div class="main">
  <div class="top">
    <span class="dot" id="dot"></span><span class="stat" id="provider">连接中…</span>
    <span class="spacer"></span>
    <span class="stat" id="selSkill">未选技能</span>
    <input class="key" type="password" id="apikey" placeholder="API Key">
    <button class="btn ghost sm" onclick="saveKey()">保存</button>
    <button class="btn ghost sm" onclick="loadAudit()">审计</button>
  </div>

  <div class="chat" id="chatBox">
    <div class="empty">👋 你好，我是 SuperAgent。输入消息开始对话，或点击下方工具生成图片/视频、解析文件。</div>
  </div>

  <div class="tools">
    <span class="tool" onclick="genImage()">🎨 生成图片</span>
    <span class="tool" onclick="genVideo()">🎬 生成视频</span>
    <span class="tool" onclick="genFight()">🥊 打斗视频</span>
    <span class="tool" onclick="dewatermark()">🧽 去水印</span>
    <span class="tool" onclick="document.getElementById('file').click()">📄 解析文件</span>
    <input type="file" id="file" style="display:none" onchange="uploadFile(this.files[0])">
    <span class="tool" onclick="runTask()">🚀 执行任务</span>
  </div>

  <div class="input">
    <textarea id="chatMsg" placeholder="输入消息，Enter 发送…（可描述要生成的图片/视频）"></textarea>
    <button class="btn" id="chatBtn" onclick="chat()">发送</button>
  </div>
</div>

<!-- 添加技能弹窗 -->
<div class="modal" id="addSkillModal">
  <div class="box">
    <h3>添加技能</h3>
    <input id="skName" placeholder="技能名称，如：数据可视化">
    <textarea id="skDesc" placeholder="技能描述" style="min-height:70px"></textarea>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px"><input type="checkbox" id="skForge"> 部署为可执行工具（LLM 生成代码并集成）</label>
    <div class="row"><button class="btn ghost" onclick="closeAddSkill()">取消</button><button class="btn" onclick="addSkill()">添加</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const key=()=>$('apikey').value||localStorage.getItem('sa_key')||'';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function saveKey(){localStorage.setItem('sa_key',$('apikey').value.trim());toast('已保存')}
$('apikey').value=localStorage.getItem('sa_key')||'';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function api(path,method='GET',body){
  const h={'Content-Type':'application/json'};const k=key();if(k)h['X-API-Key']=k;
  let r;try{r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined})}
  catch(e){return{status:0,data:{error:'网络错误:'+e.message}}}
  const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={raw:t}}
  return{status:r.status,data:d};
}
const spin='<span class="spin"></span>';

// 技能
let skills=[],selected=null;
async function loadSkills(){
  const{data}=await api('/skills');skills=data.skills||[];
  const el=$('skillList');
  el.innerHTML=skills.map(s=>`<div class="skill ${s.enabled?'on':''}" onclick="toggleSkill('${s.id}')">
    <div class="ico">${icon(s.id)}</div>
    <div><div class="t">${esc(s.name)}</div><div class="d">${esc(s.category)}</div></div>
    <div class="sw"></div></div>`).join('');
}
function icon(id){return ({code:'💻',design:'🎨',video:'🎬',image_gen:'🖼️',video_gen:'🎞️',search:'🔍',file:'📄',sysops:'🖥️',toolforge:'🔧',chat:'💬'})[id]||'✨'}
function toggleSkill(id){const s=skills.find(x=>x.id===id);s.enabled=!s.enabled;loadSkills();selected=s.enabled?id:(selected===id?null:selected);$('selSkill').textContent=s.enabled?('已选:'+s.name):'未选技能'}

// 聊天
function addMsg(role,text,html){
  const box=$('chatBox');if(box.querySelector('.empty'))box.innerHTML='';
  const d=document.createElement('div');d.className='msg '+(role==='me'?'me':'ai');
  d.innerHTML=`<div class="av">${role==='me'?'🧑':'🤖'}</div><div class="bub">${text?esc(text):''}${html||''}</div>`;
  box.appendChild(d);box.scrollTop=box.scrollHeight;return d;
}
async function chat(){
  const m=$('chatMsg').value.trim();if(!m)return;
  addMsg('me',m);$('chatMsg').value='';
  const btn=$('chatBtn');btn.disabled=true;btn.innerHTML=spin+'…';
  const{status,data}=await api('/chat','POST',{message:m});
  btn.disabled=false;btn.textContent='发送';
  addMsg('ai',status===200?data.reply:'❌ '+(data.error||data.raw||status));
}
$('chatMsg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chat()}});

// 图片（多候选画布 + 择优）
async function genImage(){
  const p=prompt('🎨 输入图片描述：','一只卡通猫在雪地里打滚，电影感光影');
  if(!p)return;
  const d=addMsg('me','🎨 生成图片：'+p);
  const h=addMsg('ai','',spin+' 生成多套候选（约 20-40 秒）…');
  const{status,data}=await api('/image','POST',{prompt:p,count:3});
  if(status===200&&data.urls){
    h.querySelector('.bub').innerHTML=`<b>多套候选（点击「选用」择优）：</b><div class="canvas"><div class="grid">${data.urls.map((u,i)=>`<div class="cell" id="img${i}"><img src="${u}"><button class="btn ok sm pick" onclick="pickImg(${i})">选用 ${i+1}</button></div>`).join('')}</div></div>`;
  }else{h.querySelector('.bub').textContent='❌ '+(data.error||data.raw||status)}
}
function pickImg(i){
  document.querySelectorAll('.grid .cell').forEach(c=>c.classList.remove('picked'));
  const c=document.getElementById('img'+i);c.classList.add('picked');
  toast('已选用第 '+(i+1)+' 张（人工择优）');
}

// 视频（剧本 + 成片画布）
async function genVideo(){
  const p=prompt('🎬 输入视频描述：','无人机航拍海岸线，海浪拍打礁石，日落');
  if(!p)return;
  addMsg('me','🎬 生成视频：'+p);
  const h=addMsg('ai','',spin+' 生成中（约 1-3 分钟，请耐心等待）…');
  const{status,data}=await api('/video','POST',{prompt:p});
  if(status===200&&data.url){
    h.querySelector('.bub').innerHTML=`<div class="tag">剧本/分镜已生成</div><div class="canvas"><video controls src="${data.url}"></video></div>`;
  }else{h.querySelector('.bub').textContent='❌ '+(data.error||data.raw||status)}
}

// 打斗视频
async function genFight(){
  const style=prompt('🥊 打斗风格：street(街头) / martial(武术) / military(军警)','martial');
  if(!style)return;
  const desc=prompt('打斗描述：','两名武术高手在擂台上切磋');
  addMsg('me','🥊 生成打斗视频（'+style+'）：'+desc);
  const h=addMsg('ai','',spin+' 生成中（约 1-3 分钟）…');
  const{status,data}=await api('/video/fight','POST',{style,description:desc});
  if(status===200&&data.url){
    h.querySelector('.bub').innerHTML=`<div class="canvas"><video controls src="${data.url}"></video></div><div class="muted">${esc(data.prompt||'')}</div>`;
  }else{h.querySelector('.bub').textContent='❌ '+(data.error||status)}
}

// 去水印
async function dewatermark(){
  const url=prompt('🧽 输入素材 URL（仅限自有生成素材）','');
  if(!url)return;
  addMsg('me','🧽 去水印');
  const h=addMsg('ai','',spin+' 处理中…');
  const{status,data}=await api('/video/dewatermark','POST',{url});
  if(status===200&&data.url){
    h.querySelector('.bub').innerHTML=`<div class="canvas"><video controls src="${data.url}"></video></div>`;
  }else{h.querySelector('.bub').textContent='❌ '+(data.error||status)}
}

// 文件
function toBase64(buf){let b='';const c=0x8000;for(let i=0;i<buf.length;i+=c)b+=String.fromCharCode.apply(null,buf.subarray(i,i+c));return btoa(b)}
async function uploadFile(f){
  if(!f)return;
  addMsg('me','📄 上传：'+f.name);
  const h=addMsg('ai','',spin+' 解析中…');
  const buf=new Uint8Array(await f.arrayBuffer());
  const{status,data}=await api('/upload','POST',{filename:f.name,content:toBase64(buf),analyze:true});
  if(status===200){h.querySelector('.bub').innerHTML=`<b>${esc(data.filename)}</b>（${data.chars} 字）<br><br>${esc(data.analysis||data.preview||'')}`}
  else{h.querySelector('.bub').textContent='❌ '+(data.error||data.raw||status)}
}

// 任务
async function runTask(){
  const t=prompt('🚀 输入任务描述：','用Python写一个判断闰年的命令行工具');
  if(!t)return;
  addMsg('me','🚀 任务：'+t);
  const h=addMsg('ai','',spin+' 执行中（可能较久）…');
  const{status,data}=await api('/run','POST',{text:t,auto_approve:true});
  h.querySelector('.bub').textContent=status===200?('✅ 完成：state='+data.result?.state+'\n'+JSON.stringify(data.result?.artifacts||{},null,2)):('❌ '+(data.error||status));
}

// 技能弹窗
function openAddSkill(){$('addSkillModal').classList.add('show')}
function closeAddSkill(){$('addSkillModal').classList.remove('show')}
async function addSkill(){
  const name=$('skName').value.trim();if(!name)return toast('请输入名称');
  const{data}=await api('/skills','POST',{action:'add',name,description:$('skDesc').value.trim(),forge:$('skForge').checked});
  closeAddSkill();$('skName').value='';$('skDesc').value='';
  if(data.forge_error)toast('已添加，但部署失败：'+data.forge_error);else toast('技能已添加');
  loadSkills();
}

async function loadAudit(){
  const{data}=await api('/audit?limit=10');const ev=data.events||[];
  const h=addMsg('ai','📋 最近审计：\n'+ev.map(e=>`${e.ts.slice(11,19)} [${e.level}] ${e.action}→${e.result}`).join('\n')||'无');
}

async function health(){try{const{data}=await api('/health');$('dot').classList.add('ok');$('provider').textContent=(data.provider||'')+' / '+(data.model||'')}catch{$('dot').classList.remove('ok')}}

health();loadSkills();
</script>
</body>
</html>
