<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperAgent 控制台</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh; }
  .top { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .top h1 { font-size:18px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--err); display:inline-block; }
  .dot.ok { background:var(--ok); }
  .api { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .api input { background:#0b1220; border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; width:240px; font-family:monospace; }
  .wrap { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:16px 20px; max-width:1200px; margin:0 auto; }
  @media (max-width:820px){ .wrap{grid-template-columns:1fr;} }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .card h2 { font-size:14px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  textarea, input[type=text], select { background:#0b1220; border:1px solid var(--border); color:var(--text); padding:9px 11px; border-radius:8px; font-size:14px; width:100%; }
  textarea { min-height:80px; resize:vertical; font-family:inherit; }
  button { background:var(--accent); color:#0b1220; border:none; padding:9px 16px; border-radius:8px; font-weight:600; cursor:pointer; font-size:14px; }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  button.ok { background:var(--ok); } button.err { background:var(--err); color:#fff; }
  .out { background:#0b1220; border:1px solid var(--border); border-radius:8px; padding:10px; min-height:60px; max-height:260px; overflow:auto; font-size:13px; white-space:pre-wrap; word-break:break-word; font-family:Consolas,monospace; }
  .row { display:flex; gap:8px; align-items:center; }
  .row.grow { align-items:stretch; }
  .muted { color:var(--muted); font-size:12px; }
  .item { border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; }
  .item .btns { display:flex; gap:6px; margin-top:8px; }
  .badge { font-size:11px; padding:2px 7px; border-radius:20px; background:var(--border); color:var(--muted); }
  .file-input { position:relative; }
  label.toggle { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
  <div class="top">
    <span class="dot" id="dot"></span>
    <h1>SuperAgent 控制台</h1>
    <span class="badge" id="provider">-</span>
    <div class="api">
      <input type="password" id="apikey" placeholder="API Key（可选，/health 之外必需）">
      <button class="ghost" onclick="saveKey()">保存</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>💬 对话</h2>
      <textarea id="chatMsg" placeholder="输入消息，回车发送…"></textarea>
      <button onclick="chat()">发送</button>
      <div class="out" id="chatOut"></div>
    </div>

    <div class="card">
      <h2>🚀 执行任务</h2>
      <textarea id="taskText" placeholder="描述任务，例如：用Python写一个判断闰年的命令行工具"></textarea>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="autoApprove" checked> 自动放行（演示）</label>
        <button onclick="run()">执行</button>
      </div>
      <div class="out" id="taskOut"></div>
    </div>

    <div class="card">
      <h2>📄 文件上传解析</h2>
      <input type="file" id="file" class="file-input">
      <label class="toggle"><input type="checkbox" id="analyze" checked> 用 LLM 分析内容</label>
      <button onclick="upload()">上传并解析</button>
      <div class="out" id="uploadOut"></div>
    </div>

    <div class="card">
      <h2>✅ 待审批</h2>
      <button class="ghost" onclick="loadPending()">刷新</button>
      <div id="pendingList" class="out" style="background:transparent;border:none;padding:0;"></div>
    </div>

    <div class="card" style="grid-column:1/-1;">
      <h2>📋 审计日志</h2>
      <div class="row"><button class="ghost" onclick="loadAudit()">刷新</button></div>
      <div class="out" id="auditOut"></div>
    </div>
  </div>

<script>
const keyInput = () => document.getElementById('apikey').value || localStorage.getItem('sa_key') || '';
function loadKey(){ const k=localStorage.getItem('sa_key')||''; document.getElementById('apikey').value=k; }
function saveKey(){ localStorage.setItem('sa_key', document.getElementById('apikey').value.trim()); toast('API Key 已保存'); }

async function api(path, method='GET', body){
  const h = {'Content-Type':'application/json'};
  const k = keyInput(); if(k) h['X-API-Key']=k;
  const r = await fetch(path, {method, headers:h, body: body?JSON.stringify(body):undefined});
  const txt = await r.text();
  try { return {status:r.status, data:JSON.parse(txt)}; } catch { return {status:r.status, data:{raw:txt}}; }
}
function out(id, text){ document.getElementById(id).textContent = typeof text==='string'?text:JSON.stringify(text,null,2); }
function toast(m){ document.getElementById('provider').textContent=m; }

async function health(){
  try {
    const {data} = await api('/health');
    document.getElementById('dot').classList.add('ok');
    toast(data.provider + ' / ' + data.model);
  } catch { document.getElementById('dot').classList.remove('ok'); }
}

async function chat(){
  const m = document.getElementById('chatMsg').value.trim();
  if(!m) return;
  out('chatOut','思考中…');
  const {status,data} = await api('/chat','POST',{message:m});
  out('chatOut', status===200 ? data.reply : JSON.stringify(data));
}
document.getElementById('chatMsg').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chat();} });

async function run(){
  const text = document.getElementById('taskText').value.trim();
  if(!text) return;
  out('taskOut','执行中（可能较久）…');
  const {status,data} = await api('/run','POST',{text, auto_approve:document.getElementById('autoApprove').checked});
  out('taskOut', data);
}

async function upload(){
  const f = document.getElementById('file').files[0];
  if(!f) return toast('请先选择文件');
  out('uploadOut','解析中…');
  const buf = await f.arrayBuffer();
  const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
  const {status,data} = await api('/upload','POST',{filename:f.name, content:b64, analyze:document.getElementById('analyze').checked});
  out('uploadOut', data);
}

async function loadPending(){
  const {data} = await api('/pending');
  const list = data.pending || [];
  const el = document.getElementById('pendingList');
  if(!list.length){ el.innerHTML = '<div class="muted">无待审批</div>'; return; }
  el.innerHTML = list.map(p=>`<div class="item"><b>${p.action}</b> <span class="muted">${p.resource||''}</span><div class="muted">${p.reason||''}</div><div class="btns"><button class="ok" onclick="decide('${p.id}','approve')">放行</button><button class="ghost" onclick="decide('${p.id}','revise')">修改</button><button class="err" onclick="decide('${p.id}','reject')">驳回</button></div></div>`).join('');
}
async function decide(id, decision){
  const fb = prompt(decision==='approve'?'备注(可选)':'请输入'+decision+'意见:','');
  await api('/approve','POST',{id, decision, feedback:fb||''});
  loadPending();
}
async function loadAudit(){
  const {data} = await api('/audit?limit=30');
  const ev = data.events||[];
  out('auditOut', ev.map(e=>`${e.ts} [${e.level}] ${e.action} -> ${e.result}`).join('\n')||'无记录');
}

loadKey(); health();
</script>
</body>
</html>
